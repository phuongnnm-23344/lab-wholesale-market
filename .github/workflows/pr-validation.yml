name: PR Validation

on:
  pull_request:
    types: [opened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Validate PR Template
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const errors = [];
            const warnings = [];

            // Check if PR has summary
            if (!prBody.includes('## 1. Summary')) {
              errors.push('❌ Missing Summary section');
            }

            // Check if operations impact is addressed
            if (!prBody.includes('## 4. Operations & Deployment Impact')) {
              errors.push('❌ Missing Operations & Deployment Impact section');
            }

            // Check if testing section is filled
            if (!prBody.includes('## 7. Testing')) {
              warnings.push('⚠️ Missing Testing section');
            }

            // Check if related issue is linked
            if (!prBody.match(/Related Issue: #\d+/)) {
              warnings.push('⚠️ No related issue linked');
            }

            // Post comment if validation has issues
            if (errors.length > 0 || warnings.length > 0) {
              let message = '## PR Template Validation\n\n';

              if (errors.length > 0) {
                message += '### Errors (must fix)\n' + errors.join('\n') + '\n\n';
              }

              if (warnings.length > 0) {
                message += '### Warnings (please address)\n' + warnings.join('\n') + '\n\n';
              }

              message += 'Please update your PR description to include all required sections.';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });

              if (errors.length > 0) {
                core.setFailed('PR template validation failed');
              }
            } else {
              console.log('✅ PR template validation passed');
            }
