name: Issue Triage — Auto Label

# ============================================================
# ISSUE TRIAGE — AUTO LABEL
# ============================================================
# Triggered when a new issue is opened.
# Reads the issue body to detect dropdown selections from
# GitHub Issue Forms and applies the corresponding labels.
#
# Labels applied:
#
# [Dev Task] — Task Type field:
#   Development - Frontend          → team:frontend
#   Development - Backend           → team:backend
#   Development - NativeApp (iOS)   → team:native-ios
#   Development - NativeApp (Android) → team:native-android
#   Development - NativeApp (MultiPF) → team:native-multiPF
#   Development - AI                → team:ai
#   Development - Infrastructure    → team:infrastructure
#
# [Dev Task] — Task Category field:
#   Task    → category:task
#   Feature → category:feature
#
# [QA Bug / UAT Bug / Production Bug] — Severity Level field:
#   Low      → severity:low
#   Medium   → severity:medium
#   High     → severity:high
#   Critical → severity:critical
#
# [QA Bug / UAT Bug] — Test Type field:
#   Functional Test                → testtype:functionaltest
#   Layout Test                    → testtype:layouttest
#   Performance Test               → testtype:performancetest
#   Stress Test                    → testtype:stresstest
#   Access Control & Security Test → testtype:accesscontrol&securitytest
#
# [Documentation] — Document Type field:
#   Requirement Document      → doctype:requirement
#   Screen Specification      → doctype:spec
#   Database Design           → doctype:spec
#   API Design                → doctype:spec
#   Technical Design          → doctype:spec
#   Function Specifications   → doctype:spec
#   Other                     → (no label)
#
# Requirements:
#   - Labels must be pre-created in the repository.
#     Run the label bootstrap script or create manually via GitHub UI.
#   - Default GITHUB_TOKEN is sufficient.
# ============================================================

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage-labels:
    name: Apply Triage Labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on issue form selections
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body  = issue.body || '';
            const existingLabels = issue.labels.map(l => l.name);
            const labelsToAdd = [];

            // ─────────────────────────────────────────────
            // Helper: extract value after a markdown header
            // Handles both "### Header\n\nValue" (forms) and
            // "### Header\nValue" (plain markdown)
            // ─────────────────────────────────────────────
            function extractField(body, header) {
              const escaped = header.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex   = new RegExp(`###\\s*${escaped}\\s*\\n+([^\\n#]+)`, 'i');
              const match   = body.match(regex);
              return match ? match[1].trim() : null;
            }

            // ─────────────────────────────────────────────
            // [Dev Task] Team label from "Task Type" field
            // ─────────────────────────────────────────────
            const DEV_TASK_LABEL = 'type:devtask';
            if (existingLabels.includes(DEV_TASK_LABEL)) {
              const taskType = extractField(body, 'Task Type');
              console.log(`Task Type: ${taskType}`);

              const teamLabelMap = {
                'Development - Frontend':              'team:frontend',
                'Development - Backend':               'team:backend',
                'Development - NativeApp (iOS)':       'team:native-ios',
                'Development - NativeApp (Android)':   'team:native-android',
                'Development - NativeApp (MultiPF)':   'team:native-multiPF',
                'Development - AI':                    'team:ai',
                'Development - Infrastructure':        'team:infrastructure',
              };

              if (taskType && teamLabelMap[taskType]) {
                labelsToAdd.push(teamLabelMap[taskType]);
              }

              // ─────────────────────────────────────────────
              // [Dev Task] Category label from "Task Category" field
              // ─────────────────────────────────────────────
              const taskCategory = extractField(body, 'Task Category');
              console.log(`Task Category: ${taskCategory}`);

              const categoryLabelMap = {
                'Task':    'category:task',
                'Feature': 'category:feature',
              };

              if (taskCategory && categoryLabelMap[taskCategory]) {
                labelsToAdd.push(categoryLabelMap[taskCategory]);
              }
            }

            // ─────────────────────────────────────────────
            // [QA Bug / UAT Bug / Production Bug]
            // Severity label from "Severity Level" field
            // ─────────────────────────────────────────────
            const BUG_LABELS = ['type:qabug', 'type:uatbug', 'type:productionbug'];
            const isBug = BUG_LABELS.some(l => existingLabels.includes(l));

            if (isBug) {
              const severity = extractField(body, 'Severity Level');
              console.log(`Severity Level: ${severity}`);

              const severityLabelMap = {
                'Low':      'severity:low',
                'Medium':   'severity:medium',
                'High':     'severity:high',
                'Critical': 'severity:critical',
              };

              if (severity && severityLabelMap[severity]) {
                labelsToAdd.push(severityLabelMap[severity]);
              }
            }

            // ─────────────────────────────────────────────
            // [QA Bug / UAT Bug]
            // Test Type label from "Test Type" field
            // ─────────────────────────────────────────────
            const QA_UAT_LABELS = ['type:qabug', 'type:uatbug'];
            const isQaOrUat = QA_UAT_LABELS.some(l => existingLabels.includes(l));

            if (isQaOrUat) {
              const testType = extractField(body, 'Test Type');
              console.log(`Test Type: ${testType}`);

              const testTypeLabelMap = {
                'Functional Test':                 'testtype:functionaltest',
                'Layout Test':                     'testtype:layouttest',
                'Performance Test':                'testtype:performancetest',
                'Stress Test':                     'testtype:stresstest',
                'Access Control & Security Test':  'testtype:accesscontrol&securitytest',
              };

              if (testType && testTypeLabelMap[testType]) {
                labelsToAdd.push(testTypeLabelMap[testType]);
              }
            }

            // ─────────────────────────────────────────────
            // [Documentation]
            // Document Type label from "Document Type" field
            // ─────────────────────────────────────────────
            const DOCUMENTATION_LABEL = 'type:documentation';
            if (existingLabels.includes(DOCUMENTATION_LABEL)) {
              const documentType = extractField(body, 'Document Type');
              console.log(`Document Type: ${documentType}`);

              const documentTypeLabelMap = {
                'Requirement Document':    'doctype:requirement',
                'Screen Specification':    'doctype:spec',
                'Database Design':         'doctype:spec',
                'API Design':              'doctype:spec',
                'Technical Design':        'doctype:spec',
                'Function Specifications': 'doctype:spec',
              };

              if (documentType && documentTypeLabelMap[documentType]) {
                labelsToAdd.push(documentTypeLabelMap[documentType]);
              }
            }

            // ─────────────────────────────────────────────
            // Apply labels
            // ─────────────────────────────────────────────
            if (labelsToAdd.length === 0) {
              console.log('No additional labels to apply.');
              return;
            }

            console.log(`Applying labels: ${labelsToAdd.join(', ')}`);

            try {
              await github.rest.issues.addLabels({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                labels:       labelsToAdd,
              });
              console.log('Labels applied successfully.');
            } catch (error) {
              core.warning(
                `Could not apply some labels: ${error.message}\n` +
                'Make sure all required labels exist in this repository.\n' +
                'See docs/guides/github-project-board-setup.md for the label bootstrap guide.'
              );
            }
