constraint_note: '完納奨励金 (FG-09) tách thành issue riêng theo từng khối K1–K9 của INC_ENGINE_TECH §4, không gộp vào settle (FG-07/08) hay rule (FG-10).

  Lý do: một con số thưởng phụ thuộc ~10 biến độc lập — kỳ tính thưởng IP(g), 入金日 trên CSV ngân hàng, 支払期日 theo lịch ngân hàng, thuế theo suất × kỳ, bậc + version quy chế của kỳ (không phải của ngày khóa),
  judgement 要確認, DELTA cho mọi kỳ đã khóa, CARRY / CARRY_EXPIRED theo năm TC, GD 後入力 chuyển kỳ, 修正申請 KANNO / INCENTIVE.

  Mỗi khối có DoD và test vector riêng (TV-01..15); gộp lại thì một lỗi ở K2 (FIFO) hay K6 (DELTA) bị che bởi số tổng đúng tình cờ — tách để review / test từng biến.

  Thứ tự: K1 ∥ K2 → K3 → K4 → K5 → K6 → K7 → K8 (cần tất cả); K9 đọc ra. Điểm chờ khách đi kèm từng issue: E-02 (請求番号, K2), E-03 (bảng 交付率 thật, K4), E-06 (cách tính thuế, K3), Q-INC-03 (tạo kỳ, K8), Q-ARCH-08
  (CARRY_EXPIRED, K7), E-14 (rollback quy chế — ảnh hưởng đường sửa tiền kỳ đã khóa), DEP-11 (màn 入金 chưa spec).

  Luật giữ: không ghi đè (DELTA / CARRY / 期ロック chỉ thêm), quy chế có version (tra V_X của kỳ), người quyết (要確認, 期ロック có MFA, không chạy tự động).

  '
