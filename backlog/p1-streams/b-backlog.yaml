gaps:
  - id: B-GAP-01
    spec: "INCENTIVE_DB §4.52 Overview (0.3.2) vs INC_ENGINE_TECH §3.4, K1-4, K6-1 (0.1.1)"
    problem: "INCENTIVE_DB 4.52 còn ghi GD LATE_ENTRY (trades có trade_date thuộc kỳ khóa, created_at > locked_at) là đầu vào DELTA (recheck N-02); TECH 0.1.1 và ADR-007 0.3.2 đã bỏ theo Q-INC-02 (GD 後入力 chuyển sang kỳ đang mở, không DELTA). Dev đọc DB Design sẽ cài sai K1-4."
    handling: fix-design
    ref: B-PS-01
    open_reason: ""
  - id: B-GAP-02
    spec: "INC_ENGINE_TECH §4.8 No 5 vs No 7; K7 Error"
    problem: "K8 ghi dòng CARRY sang P+1 ở No 5 nhưng tới No 7 mới bảo đảm P+1 tồn tại; K7 lại nói 'P+1 do K8 bảo đảm tồn tại trước khi ghi' → thứ tự mâu thuẫn, FK period_id có thể vỡ khi P+1 chưa được tạo (Q-INC-03 chưa chốt)."
    handling: fix-design
    ref: B-PS-02
    open_reason: ""
  - id: B-GAP-03
    spec: "INC_ENGINE_TECH §4.8 No 6 (端数調整), FT-09-10"
    problem: "'Σ thuế đã xuất theo ngày trong IF-ACC-01 của P' không nói theo trục nào: nếu theo business_date thì điều chỉnh của kỳ đã khóa (period_id = Q, business_date trong P) và GD 後入力 bị tính lệch → dòng 端数調整 sai cỡ cả khoản thuế, không còn là chênh làm tròn."
    handling: assumption
    ref: B-PA-01
    open_reason: ""
  - id: B-GAP-04
    spec: "INC_ENGINE_TECH §4.8 No 6; BILLING_DB 4.41 (batch tạo sau 日次締め, đóng băng)"
    problem: "Dòng 端数調整 'gắn batch của 業務日 đang mở' nhưng batch IF-ACC-01 của ngày đó chỉ được tạo lúc 日次締め và đóng băng khi tạo → lúc 期ロック chưa có batch để gắn."
    handling: assumption
    ref: B-PA-02
    open_reason: ""
  - id: B-GAP-05
    spec: "MKT_DB §4.0 (Ngày mở, enforce_open_business_day); CLOSE_DB 4.24"
    problem: "Trigger ngày mở phải gắn vào bảng nghiệp vụ của mọi module (lô, GD, giao — luồng A; điều chỉnh, 入金 — luồng B) nhưng spec không nói ai tạo hàm trigger, ai gắn vào bảng nào khi chia 3 luồng."
    handling: assumption
    ref: B-PA-03
    open_reason: ""
  - id: B-GAP-06
    spec: "BILLING_DB §4.40–§4.42 (IF-ACC-01) trong nguồn đọc luồng B; function-list FG-11 FT-11-07"
    problem: "BILLING_DB thuộc nguồn đọc của B nhưng 3 bảng journal_mappings / accounting_export_* là IF-ACC-01 (FG-11, luồng C). Không rõ ai tạo migration."
    handling: assumption
    ref: B-PA-04
    open_reason: ""
  - id: B-GAP-07
    spec: "ADJUST_DB §4.32 trade_fixes; TRADE_SAME_DAY_FIX_TECH (luồng A); STL_DAY_CLOSE checklist #5, #9"
    problem: "trade_fixes nằm trong ADJUST_DB (nguồn B) nhưng logic ghi là 当日訂正 của luồng A; checklist 日次締め (B) đọc nó. Chủ sở hữu migration không rõ."
    handling: assumption
    ref: B-PA-05
    open_reason: ""
  - id: B-GAP-08
    spec: "INC_ENGINE_TECH §4.2 (K2 chạy lúc nhập CSV / hủy batch / gán tay); BILLING_DB 4.48"
    problem: "Phân bổ FIFO vào kỳ OPEN chốt theo B tại lúc nhập; sau đó 修正申請 / 当日訂正 làm B của kỳ đó giảm thì phân bổ thừa không được dời sang kỳ đang thiếu → người mua có thể mất 完納 ở kỳ khác. Spec không có quy tắc phân bổ lại (chỉ có cảnh báo OVERPAYMENT ở K9)."
    handling: assumption
    ref: B-PA-06
    open_reason: ""
  - id: B-GAP-09
    spec: "SC-09-04_SPEC §6.2 câu ví dụ; API-INC-001 ví dụ response"
    problem: "Câu ví dụ nút mờ ghi 「支払期日（2027/09/10）」 trong khi [1] ví dụ kỳ 2027-09 hạn 2027/10/08; ví dụ API-INC-001 có lateEntries tradeDate 2027-07-30, trước go-live 2027-08-01 (L4-A09)."
